name: Pir conflicts (reusable)

# Detecta PRs con conflictos de merge y avisa por comentario + mail, explicando el motivo
# (archivos en conflicto, quien cambio que, y un fragmento del conflicto).
# Corre en pull_request_target (los workflows pull_request NO corren si hay conflictos)
# y en push a la rama por defecto (un PR puede pasar a tener conflictos despues).
# Seguridad: hace checkout de la rama BASE y solo trae los objetos del PR para analizarlos
# con git (merge-tree/log); nunca hace checkout ni ejecuta codigo del PR.

on:
  workflow_call:
    inputs:
      email_to:
        type: string
        default: francorep2@gmail.com
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      PIR_APP_ID:
        required: false
      PIR_APP_PRIVATE_KEY:
        required: false
      RESEND_API_KEY:
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      prs: ${{ steps.detect.outputs.prs }}
    env:
      HAS_APP: ${{ secrets.PIR_APP_ID != '' && secrets.PIR_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Get Pir app token
        id: pir
        if: ${{ env.HAS_APP == 'true' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.PIR_APP_ID }}
          private-key: ${{ secrets.PIR_APP_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-issues: write
          permission-contents: read

      # Con pull_request_target y push, el checkout por defecto es la rama base/por defecto.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.pir.outputs.token || github.token }}

      - name: Detect conflicts and notify
        id: detect
        env:
          GH_TOKEN: ${{ steps.pir.outputs.token || github.token }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PIR_APP_ID: ${{ secrets.PIR_APP_ID }}
          EMAIL_TO: ${{ inputs.email_to }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          esc() { jq -rn --arg t "$1" '$t|@html'; }
          SHORT_REPO="${REPO#*/}"
          LOGO="https://avatars.githubusercontent.com/in/${PIR_APP_ID}?s=96"

          if [ "$EVENT" = "pull_request_target" ]; then
            PRS="$PR_NUMBER"
          else
            PRS=$(gh pr list -R "$REPO" --state open --base "$DEFAULT_BRANCH" --json number --jq '.[].number')
          fi

          NEW=""   # PRs con conflicto recien avisados: despues Pir intenta resolverlos solo
          for n in $PRS; do
            MERGEABLE=null
            for i in 1 2 3 4 5 6; do
              INFO=$(gh api "repos/$REPO/pulls/$n")
              MERGEABLE=$(echo "$INFO" | jq -r '.mergeable')
              [ "$MERGEABLE" != "null" ] && break
              sleep 5
            done
            [ "$MERGEABLE" = "false" ] || continue
            [ "$(echo "$INFO" | jq -r '.draft')" = "true" ] && continue

            HEAD_SHA=$(echo "$INFO" | jq -r '.head.sha')
            BASE_REF=$(echo "$INFO" | jq -r '.base.ref')
            HEAD_REF=$(echo "$INFO" | jq -r '.head.ref')
            TITLE=$(echo "$INFO" | jq -r '.title')
            URL=$(echo "$INFO" | jq -r '.html_url')
            MARK="<!-- pir-conflict:$HEAD_SHA -->"

            # Un aviso por (PR, commit): salir temprano si ya se aviso para este head.
            if gh api "repos/$REPO/issues/$n/comments" --paginate --jq '.[].body' | grep -qF "$MARK"; then
              continue
            fi

            # ---- Analisis del motivo (solo git sobre objetos; no se ejecuta codigo del PR) ----
            NFILES=0; AHEAD=0
            DETAILS=""        # Markdown (comentario del PR)
            CARDS=""          # HTML (mail)
            LEAD_MD=""
            if git fetch -q origin "pull/$n/head:refs/pir/pr-$n" 2>/dev/null; then
              BASE="origin/$BASE_REF"
              PRREF="refs/pir/pr-$n"
              MB=$(git merge-base "$BASE" "$PRREF" 2>/dev/null || true)
              OUT=$(git merge-tree --write-tree --name-only --messages "$BASE" "$PRREF" 2>&1 || true)
              TREE=$(echo "$OUT" | head -1)
              FILES=$(echo "$OUT" | sed -n '2,/^$/p' | sed '/^$/d')
              NFILES=$(echo "$FILES" | grep -c . || true)

              if [ -n "$MB" ]; then
                AHEAD=$(git rev-list --count "$MB..$BASE")
                LEAD_MD="La rama \`$BASE_REF\` avanzo $AHEAD commit(s) desde que se creo esta rama (punto de union: \`${MB:0:7}\`), y algunos tocan las mismas lineas que esta PR."
              fi
              DETAILS="$LEAD_MD"$'\n\n'"Archivos en conflicto ($NFILES):"

              c=0
              while IFS= read -r f; do
                [ -z "$f" ] && continue
                c=$((c+1))
                if [ "$c" -gt 8 ]; then
                  DETAILS="$DETAILS"$'\n'"- ... y $((NFILES-8)) mas"
                  CARDS="$CARDS<p style=\"font-size:14px;color:#656d76\">... y $((NFILES-8)) archivo(s) m&aacute;s.</p>"
                  break
                fi
                KIND=$(echo "$OUT" | grep -F "CONFLICT" | grep -F "$f" | head -1 || true)
                BASE_LOG=""; PR_LOG=""
                if [ -n "$MB" ]; then
                  BASE_LOG=$(git log --no-merges -n 3 --date=short --format='%h %s (%an, %ad)' "$MB..$BASE" -- "$f" || true)
                  PR_LOG=$(git log --no-merges -n 3 --date=short --format='%h %s (%an, %ad)' "$MB..$PRREF" -- "$f" || true)
                fi

                # Fragmento del conflicto (solo archivos de texto; primer bloque, max 25 lineas)
                HUNK=""
                if git cat-file -e "$TREE:$f" 2>/dev/null; then
                  HUNK=$(git show "$TREE:$f" 2>/dev/null | grep -Iq . && git show "$TREE:$f" | awk '/^<<<<<<< /{p=1} p{print} /^>>>>>>> /{if(p) exit}' | head -25 || true)
                fi

                # Markdown
                DETAILS="$DETAILS"$'\n'"- \`$f\`"
                [ -n "$KIND" ] && DETAILS="$DETAILS"$'\n'"  - $KIND"
                if [ -n "$BASE_LOG" ]; then
                  DETAILS="$DETAILS"$'\n'"  - Cambios en \`$BASE_REF\`:"
                  while IFS= read -r l; do DETAILS="$DETAILS"$'\n'"    - $l"; done <<< "$BASE_LOG"
                fi
                if [ -n "$PR_LOG" ]; then
                  DETAILS="$DETAILS"$'\n'"  - Cambios en esta PR:"
                  while IFS= read -r l; do DETAILS="$DETAILS"$'\n'"    - $l"; done <<< "$PR_LOG"
                fi
                if [ -n "$HUNK" ]; then
                  DETAILS="$DETAILS"$'\n'"  - Fragmento:"$'\n'"\`\`\`"$'\n'"$HUNK"$'\n'"\`\`\`"
                fi

                # HTML (tarjeta por archivo)
                CARD="<div style=\"border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0\">"
                CARD="$CARD<div style=\"font-family:Menlo,Consolas,monospace;font-size:13px;font-weight:700;word-break:break-all\">$(esc "$f")</div>"
                [ -n "$KIND" ] && CARD="$CARD<div class=\"muted\" style=\"font-size:12px;color:#656d76;margin:2px 0 8px;word-break:break-word\">$(esc "$KIND")</div>"
                if [ -n "$BASE_LOG" ]; then
                  CARD="$CARD<div style=\"font-size:13px;font-weight:700;margin-top:8px\">En <code>$(esc "$BASE_REF")</code></div>"
                  while IFS= read -r l; do CARD="$CARD<div style=\"font-size:14px;line-height:1.4;margin:2px 0\">&bull; $(esc "$l")</div>"; done <<< "$BASE_LOG"
                fi
                if [ -n "$PR_LOG" ]; then
                  CARD="$CARD<div style=\"font-size:13px;font-weight:700;margin-top:8px\">En esta PR</div>"
                  while IFS= read -r l; do CARD="$CARD<div style=\"font-size:14px;line-height:1.4;margin:2px 0\">&bull; $(esc "$l")</div>"; done <<< "$PR_LOG"
                fi
                if [ -n "$HUNK" ]; then
                  CARD="$CARD<pre style=\"white-space:pre-wrap;word-break:break-word;background:#f6f8fa;color:#1f2328;padding:10px;border-radius:8px;font-size:12px;line-height:1.45;margin:10px 0 0\">$(esc "$HUNK")</pre>"
                fi
                CARDS="$CARDS$CARD</div>"
              done <<< "$FILES"
              DETAILS=$(printf '%s' "$DETAILS" | head -c 6000)
            else
              DETAILS="No pude traer la PR para analizar el detalle del conflicto."
              CARDS="<p>No pude traer la PR para analizar el detalle del conflicto.</p>"
            fi

            BODY=$(printf '### Pir: Conflictos de merge\n\nEsta PR (`%s`) tiene conflictos con `%s` y no puede mergearse todavia.\n\n%s\n\n**Que hacer**\n- Resolvelos a mano, o\n- Comenta `/pir resolver` en esta PR y Pir intenta corregirlos.\n\n%s' "$HEAD_REF" "$BASE_REF" "$DETAILS" "$MARK")

            # "Reclamar": publicar y quedarse solo si el comentario es el primero con esta marca.
            # Evita avisos duplicados cuando dos ejecuciones (push + pull_request_target) corren a la vez.
            CID=$(gh api "repos/$REPO/issues/$n/comments" -f body="$BODY" --jq '.id')
            FIRST=$(gh api "repos/$REPO/issues/$n/comments" --paginate --jq "[.[]|select(.body|contains(\"$MARK\"))]|sort_by(.id)|.[0].id // empty" | sort -n | head -1)
            if [ -n "$FIRST" ] && [ "$FIRST" != "$CID" ]; then
              gh api -X DELETE "repos/$REPO/issues/comments/$CID" > /dev/null || true
              echo "::notice::PR #$n: otra ejecucion ya aviso este conflicto; se omite el duplicado"
              continue
            fi

            NEW="$NEW $n"

            if [ -z "${RESEND_API_KEY:-}" ]; then
              echo "::notice::RESEND_API_KEY no configurada; no se envio mail (PR #$n)"
              continue
            fi

            TITLE_H=$(esc "$TITLE")
            BASE_H=$(esc "$BASE_REF")
            if [ -n "$LEAD_MD" ]; then
              LEAD_H="La rama <code>$BASE_H</code> avanz&oacute; $AHEAD commit(s) desde que se cre&oacute; esta rama, y algunos tocan las mismas l&iacute;neas que este PR."
            else
              LEAD_H="Este PR tiene conflictos con <code>$BASE_H</code> y no puede mergearse todav&iacute;a."
            fi

            cat > mail.html <<EOF
          <!doctype html><html lang="es"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="color-scheme" content="light dark"><meta name="supported-color-schemes" content="light dark">
          <style>
            body{margin:0;padding:0;background:#f3f4f6}
            @media (prefers-color-scheme: dark){
              body,.bg{background:#0d1117 !important}
              .card{background:#161b22 !important;color:#e6edf3 !important}
              .muted{color:#9da7b3 !important}
            }
            @media (max-width:480px){ .btn{display:block !important;text-align:center !important} }
          </style></head>
          <body class="bg" style="margin:0;padding:0;background:#f3f4f6">
          <div style="display:none;max-height:0;overflow:hidden;opacity:0">🔀 Conflictos de merge &middot; $TITLE_H</div>
          <div style="max-width:560px;margin:0 auto;padding:12px">
            <div class="card" style="background:#ffffff;border-radius:14px;padding:18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1f2328">
              <table role="presentation" style="border-collapse:collapse"><tr>
                <td style="padding-right:12px;vertical-align:middle"><img src="$LOGO" width="44" height="44" alt="Pir" style="display:block;border-radius:10px"></td>
                <td style="vertical-align:middle"><div style="font-size:17px;font-weight:700">Pir</div>
                  <div class="muted" style="font-size:13px;color:#656d76">$SHORT_REPO &middot; PR #$n</div></td>
              </tr></table>
              <div style="margin:18px 0 8px">
                <span style="display:inline-block;background:#dc2626;color:#ffffff;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700">🔀 Conflictos de merge</span>
              </div>
              <h1 style="font-size:19px;line-height:1.3;margin:10px 0 12px">$TITLE_H</h1>
              <p style="margin:0 0 6px">$LEAD_H</p>
              <div style="font-size:13px;font-weight:700;margin:16px 0 0;text-transform:uppercase;letter-spacing:.04em;color:#656d76">Archivos en conflicto ($NFILES)</div>
              $CARDS
              <div style="background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:12px 14px;margin:16px 0 0;font-size:15px;color:#1f2328">
                <b>Qu&eacute; hacer</b>
                <ol style="margin:8px 0 0;padding-left:20px">
                  <li style="margin:4px 0">Resolv&eacute;los a mano, o</li>
                  <li style="margin:4px 0">Coment&aacute; <code>/pir resolver</code> en el PR y Pir intenta corregirlos.</li>
                </ol>
              </div>
              <a class="btn" href="$URL" style="display:inline-block;margin-top:18px;background:#4f46e5;color:#ffffff;text-decoration:none;padding:14px 22px;border-radius:10px;font-size:16px;font-weight:700">Abrir PR</a>
            </div>
            <p class="muted" style="text-align:center;font-size:12px;color:#6b7280;margin:14px 0 0">Pir &middot; aviso autom&aacute;tico</p>
          </div></body></html>
          EOF

            TEXT=$(printf 'El PR #%s "%s" tiene conflictos con %s.\n\n%s\n\nQue hacer:\n- Resolverlos a mano.\n- Comentar "/pir resolver" en el PR para que Pir intente corregirlos.\n\n%s' "$n" "$TITLE" "$BASE_REF" "$DETAILS" "$URL")
            jq -n --arg to "$EMAIL_TO" --arg subject "🔀 Conflictos de merge · $SHORT_REPO #$n · $TITLE" --arg text "$TEXT" --rawfile html mail.html \
              '{from:"Pir <onboarding@resend.dev>", to:[$to], subject:$subject, text:$text, html:$html}' > mail.json
            curl -sS --fail-with-body https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d @mail.json > /dev/null
          done

          jq -cn --arg l "$NEW" '$l | split(" ") | map(select(. != "") | tonumber)' | sed 's/^/prs=/' >> "$GITHUB_OUTPUT"

  # Pir intenta resolver los conflictos con Claude. Si luego la revision lo aprueba, review.yml lo mergea.
  resolve:
    needs: check
    if: ${{ needs.check.outputs.prs != '' && needs.check.outputs.prs != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.check.outputs.prs) }}
    uses: francorep2/pr-reviewer/.github/workflows/resolve.yml@main
    with:
      pr: ${{ matrix.pr }}
      email_to: ${{ inputs.email_to }}
    secrets: inherit
